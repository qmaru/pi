services:
  pi:
    image: ghcr.io/qmaru/agent/pi:latest
    environment:
      PI_SKIP_VERSION_CHECK: 1
      PI_OFFLINE: 1
      PI_TELEMETRY: 0
      # PI_EVENT_FILE: 0
      # PI_EVENT_STDOUT: 0
      # PI_USAGE_FILE: 0
      # PI_USAGE_STDOUT: 0
      # PI_USAGE_MARKDOWN: 0
    env_file:
      - .env
    volumes:
      - ./examples/models.json:/root/.pi/agent/models.json
      - ./examples/settings.json:/root/.pi/agent/settings.json
      - ./extensions/pi-usage:/root/.pi/agent/extensions/pi-usage
      - ./extensions/pi-event:/root/.pi/agent/extensions/pi-event
    entrypoint:
      - pi
